# Phase 25.1 bench spike — sora-editor, BINARY DEPENDENCY ONLY (LGPL-2.1).
# Research note 2026-09-04: the spec pinned io.github.Rosemoe.sora-editor:0.23.6
# (old coordinates); the project now publishes under io.github.rosemoe and the
# newest stable verified on Maven Central is 0.24.6 — chosen so the 25.1
# decision reflects the core a Phase 25.2 integration would adopt.
sora-editor = { group = "io.github.rosemoe", name = "editor", version.ref = "soraEditor" }
sora-editor-language-java = { group = "io.github.rosemoe", name = "language-java", version.ref = "soraEditor" }
# Phase 29.1 — TextMate (VS Code grammars + themes) from the SAME BOM/version
# as `editor` (T1: never pin a second sora version). Binary dependency only;
# the module vendors tm4e (EPL-2.0→LGPL-2.1 compatible, per 25.2 law we do
# not fork or repackage). Grammars/themes ship as MIT assets (see
# assets/textmate/ + assets/licenses/).
sora-language-textmate = { group = "io.github.rosemoe", name = "language-textmate", version.ref = "soraEditor" }
# Phase 31.1 — LSP completion (Acode-style IntelliSense as Packages).
# Same BOM/version as `editor` (T1: never pin a second sora version).
# Binary dependency only; sora's editor-lsp vendors org.eclipse.lsp4j 1.0.0 +
# kotlinx-coroutines-android 1.10.2 (transitive, Gradle resolves them).
# No source vendored, no fork. LSP-2.1 license is compatible with the 25.2
# LGPL-2.1 acceptance (the editor-lsp AAR is the same module family).
#
# Status 2026-09-07: the AAR is on the version catalog and the engine is
# wired to use it via a swappable `Provider`, but the Gradle dep itself
# is gated behind the `editorLsp` Gradle property (set to `true` after
# the sora 0.24.6 AAR resolves cleanly against AGP 9.1.1 — see
# `docs/chat-phase31/PART_31_1_EDITOR_LSP.md` §3.1). For now the
# orchestrator is built and host-tested with the no-op provider; the
# follow-up commit flips the property on once the owner confirms the
# 9.3.1-vs-9.1.1 AGP delta is non-blocking (the rule.md §4.2 fix-on-
# evidence rule).
sora-editor-lsp = { group = "io.github.rosemoe", name = "editor-lsp", version.ref = "soraEditor" }
# Phase 37.1 — ZXing core for the "scan to open the phone's server" QR code.
# Apache-2.0, no transitive dependencies (docs/PHASE34_37_OSS_RESEARCH.md §4:
# "no custom QR encoder needed"). Only `core` is used — never `javase`
# (that one drags in JAI/ImageIO), and never the Android `android-core`.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
