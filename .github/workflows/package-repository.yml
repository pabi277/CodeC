name: CodeC package repository

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated repository to the CodeC Pages development channel
        required: true
        default: false
        type: boolean
      source_run_id:
        description: Existing successful package-build run ID to publish without rebuilding
        required: false
        default: ""
        type: string
      groups:
        description: Comma-separated package groups to build (base,llvm,langs) — build only failed legs after a partial-failure run
        required: false
        default: "base,llvm,langs"
        type: string
      reuse_run_id:
        description: Salvage merge — also pattern-merge the group-leg artifacts of this run ID (build only the legs that failed there)
        required: false
        default: ""
        type: string
  push:
    branches: ["**"]
    paths:
      - "codec-packages/**"
      - ".github/workflows/package-repository.yml"
      - "docs/PHASE3_PLAN.md"

permissions:
  contents: read

jobs:
  # Resolve the group matrix from the `groups` dispatch input. The known
  # group names mirror CODEC_REPOSITORY_GROUP_* in
  # codec-packages/properties.codec.sh — codec-packages/tests/
  # test_ci_guardrails.py asserts the two stay in sync; an unknown group
  # name fails here within seconds instead of hours into a build.
  plan:
    name: Resolve build groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.resolve.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate requested groups
        id: resolve
        env:
          REQUESTED: ${{ inputs.groups || 'base,llvm,langs' }}
          REUSE_RUN: ${{ inputs.reuse_run_id }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_RUN" && -n "$REUSE_RUN" ]]; then
            echo "ERROR: source_run_id and reuse_run_id are mutually exclusive: source_run_id publishes one run's artifacts as-is, while reuse_run_id merges a previous run's green legs with this run's fresh ones" >&2
            exit 1
          fi
          if [[ -n "$REUSE_RUN" && ! "$REUSE_RUN" =~ ^[0-9]+$ ]]; then
            echo "ERROR: reuse_run_id must be a GitHub Actions run ID (digits only), got: $REUSE_RUN" >&2
            exit 1
          fi
          out=()
          IFS=',' read -ra selected <<<"$REQUESTED"
          for g in "${selected[@]}"; do
            g="$(printf '%s' "$g" | tr -d '[:space:]')"
            case "$g" in
              base|llvm|langs) ;;
              "")
                echo "ERROR: empty group name in: $REQUESTED" >&2
                exit 1
                ;;
              *)
                echo "ERROR: unknown package group '$g' (known: base, llvm, langs — CODEC_REPOSITORY_GROUP_* in codec-packages/properties.codec.sh)" >&2
                exit 1
                ;;
            esac
            out+=("\"$g\"")
          done
          json="[$(IFS=,; echo "${out[*]}")]"
          echo "groups=$json" >> "$GITHUB_OUTPUT"
          echo "building group legs: $json"

  host-tests:
    name: Repository security and metadata tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository tests
        run: python3 -m unittest discover -s codec-packages/tests -p 'test_*.py' -v

  build:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish == false || inputs.source_run_id == '') && needs.plan.result == 'success' }}
    name: Build CodeC packages (${{ matrix.arch }}/${{ matrix.group }})
    needs: [host-tests, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        # 360 min is GitHub's per-job ceiling; the monolithic round-4 build
        # exceeded it twice (runs 33506104710, 33547475854). The build now
        # fans out to one leg per package group; each leg resolves its roots
        # from CODEC_REPOSITORY_GROUP_<NAME> in codec-packages/properties.codec.sh
        # (single source of truth; group/union consistency is guarded by
        # codec-packages/tests/test_ci_guardrails.py). Legs run in parallel
        # and publish-dev pattern-merges their artifacts below. The plan job
        # filters the matrix so a salvage dispatch can rebuild ONLY the legs
        # that failed and merge the green ones via reuse_run_id.
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      ARCH: ${{ matrix.arch }}
      GROUP: ${{ matrix.group }}
      CODEC_USE_DOCKER: "1"
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost || true
          docker system prune --all --force || true
          df -h

      - name: Install host requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git python3 dpkg-dev file gzip tar xz-utils
          docker --version
          dpkg-deb --version

      - name: Validate CodeC overlay
        run: |
          set -euo pipefail
          source codec-packages/properties.codec.sh
          test "$TERMUX_APP_PACKAGE" = "com.codeci.ide"
          test "$TERMUX_PREFIX" = "/data/data/com.codeci.ide/files/usr"
          ! grep -R -n --exclude='*.md' --exclude='LICENSE' \
            'build-package.sh.*-[[:space:]]*I\|build-package.sh.*--install' \
            codec-packages/scripts

      - name: Build package closure and repository
        run: |
          set -euo pipefail
          chmod +x codec-packages/scripts/*.sh codec-packages/scripts/*.py
          codec-packages/scripts/build-package-repository.sh "$ARCH" "$GROUP"

      - name: Build Phase 3 package-manager bootstrap
        if: ${{ matrix.group == 'base' }}
        run: |
          set -euo pipefail
          codec-packages/scripts/build-package-manager-bootstrap.sh "$ARCH"
          archive="codec-packages/dist/bootstrap-phase3-${ARCH}.tar.gz"
          test -s "$archive"
          tar -tzf "$archive" > bootstrap-phase3-contents.txt
          echo "archive entries: $(wc -l < bootstrap-phase3-contents.txt)"
          # NOTE: single backslash on purpose — YAML block scalars do not
          # process escapes, and in ERE '^\\.' would demand a literal
          # backslash, which tar listings never contain (silent grep failure).
          if ! grep -qE '^\./?bin/apt-get$' bootstrap-phase3-contents.txt; then
            echo "ERROR: bootstrap archive is missing ./bin/apt-get" >&2
            grep -E '^\./?bin/' bootstrap-phase3-contents.txt | head -25 >&2
            exit 1
          fi
          if ! grep -qE '^\./?bin/dpkg$' bootstrap-phase3-contents.txt; then
            echo "ERROR: bootstrap archive is missing ./bin/dpkg" >&2
            grep -E '^\./?bin/' bootstrap-phase3-contents.txt | head -25 >&2
            exit 1
          fi
          if ! grep -qE '^\./?var/lib/dpkg/status$' bootstrap-phase3-contents.txt; then
            echo "ERROR: bootstrap archive is missing ./var/lib/dpkg/status" >&2
            grep -E '^\./?var/' bootstrap-phase3-contents.txt | head -25 >&2
            exit 1
          fi
          if grep -qE '^\./?data/data/' bootstrap-phase3-contents.txt; then
            echo "nested Android path in Phase 3 bootstrap" >&2
            exit 1
          fi

      - name: Validate Phase 3 bootstrap archive
        if: ${{ matrix.group == 'base' }}
        run: |
          set -euo pipefail
          python3 codec-packages/scripts/validate-bootstrap.py \
            "codec-packages/dist/bootstrap-phase3-${ARCH}.tar.gz" 

      - name: Upload repository + bootstrap artifacts (base leg)
        if: ${{ matrix.group == 'base' }}
        uses: actions/upload-artifact@v4
        with:
          name: codec-repository-${{ matrix.arch }}-${{ matrix.group }}
          path: |
            codec-packages/dist/repository-${{ matrix.arch }}
            codec-packages/dist/bootstrap-phase3-${{ matrix.arch }}.tar.gz
            codec-packages/dist/bootstrap-phase3-${{ matrix.arch }}.tar.gz.sha256
            bootstrap-phase3-contents.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload repository artifact (non-base legs)
        if: ${{ matrix.group != 'base' }}
        uses: actions/upload-artifact@v4
        with:
          name: codec-repository-${{ matrix.arch }}-${{ matrix.group }}
          path: |
            codec-packages/dist/repository-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  publish-dev:
    name: Publish development repository
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.plan.result == 'success' && needs.host-tests.result == 'success' && (needs.build.result == 'success' || (inputs.source_run_id != '' && needs.build.result == 'skipped')) }}
    needs: [plan, host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Salvage path: when a run died on only some legs, dispatch again
      # with groups=<failed legs> and reuse_run_id=<that run> so its green
      # legs merge in place of a full rebuild (run 33629206153 was exactly
      # this scenario: langs red, base/llvm green — those artifacts are
      # immutable and retention-pinned). The marker gate below proves full
      # coverage before anything is published.
      - name: Salvage aarch64 legs from run ${{ inputs.reuse_run_id }}
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: codec-repository-aarch64-*
          merge-multiple: true
          path: input/aarch64
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvage x86_64 legs from run ${{ inputs.reuse_run_id }}
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: codec-repository-x86_64-*
          merge-multiple: true
          path: input/x86_64
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download aarch64 repository (all group legs)
        uses: actions/download-artifact@v4
        with:
          pattern: codec-repository-aarch64-*
          merge-multiple: true
          path: input/aarch64
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download x86_64 repository (all group legs)
        uses: actions/download-artifact@v4
        with:
          pattern: codec-repository-x86_64-*
          merge-multiple: true
          path: input/x86_64
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge, sign, and validate repository
        env:
          CODEC_REPOSITORY_SIGNING_KEY: ${{ secrets.CODEC_REPOSITORY_SIGNING_KEY }}
          CODEC_SIGNING_KEY_PASSPHRASE: ${{ secrets.CODEC_REPOSITORY_SIGNING_PASSPHRASE }}
          CODEC_SIGNING_FINGERPRINT: ${{ vars.CODEC_REPOSITORY_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          for required in \
            CODEC_REPOSITORY_SIGNING_KEY \
            CODEC_SIGNING_KEY_PASSPHRASE \
            CODEC_SIGNING_FINGERPRINT; do
            if [[ -z "${!required:-}" ]]; then
              echo "ERROR: required repository signing configuration is missing: $required" >&2
              exit 1
            fi
          done

          fingerprint="$(printf '%s' "$CODEC_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
            echo "ERROR: repository signing fingerprint must be 40 hexadecimal characters" >&2
            exit 1
          fi
          if ! grep -qx "signing=$fingerprint" \
            codec-packages/keys/codec-archive-keyring-v1.fingerprints; then
            echo "ERROR: configured signing fingerprint is not the pinned CodeC signing subkey" >&2
            exit 1
          fi

          gnupg_home="$RUNNER_TEMP/codec-repository-gnupg"
          rm -rf "$gnupg_home"
          install -d -m 0700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$CODEC_REPOSITORY_SIGNING_KEY" | gpg --batch --import
          unset CODEC_REPOSITORY_SIGNING_KEY

          mkdir -p input/debs
          find input/aarch64 input/x86_64 -name '*.deb' \
            -exec cp -n {} input/debs/ \;

          # Coverage gate: every group leg (freshly built or salvaged via
          # reuse_run_id) must be represented in the merged pool before ANY
          # signing/publishing happens — a partial merge must fail here,
          # not after release. Markers: nano = base, clang = llvm,
          # nodejs = langs (mirrors CODEC_REPOSITORY_GROUP_*; the guardrails
          # test asserts these names stay wired).
          for arch in aarch64 x86_64; do
            for marker in nano clang nodejs; do
              if ! ls input/debs/ | grep -qE "^${marker}_[^ ]*_${arch}\\.deb$"; then
                echo "ERROR: missing marker package '${marker}' (${arch}) — incomplete leg coverage; rebuild that leg (groups=...) or set reuse_run_id" >&2
                exit 1
              fi
            done
          done

          rm -rf packages/dev packages/keys
          chmod +x codec-packages/scripts/*.py codec-packages/scripts/*.sh

          codec-packages/scripts/generate-repository.sh \
            input/debs packages/dev aarch64 x86_64
          codec-packages/scripts/sign-repository.sh packages/dev "$fingerprint"
          unset CODEC_SIGNING_KEY_PASSPHRASE

          install -D -m 0644 \
            codec-packages/keys/codec-archive-keyring-v1.gpg \
            packages/keys/codec-archive-keyring-v1.gpg
          install -D -m 0644 \
            codec-packages/keys/codec-archive-keyring-v1.asc \
            packages/keys/codec-archive-keyring-v1.asc
          install -D -m 0644 \
            codec-packages/keys/codec-archive-keyring-v1.fingerprints \
            packages/keys/codec-archive-keyring-v1.fingerprints

          python3 codec-packages/scripts/validate-repository.py \
            packages/dev --architectures aarch64 x86_64 \
            --keyring packages/keys/codec-archive-keyring-v1.gpg \
            --signing-fingerprint "$fingerprint"

          test -f packages/dev/CODEC-REPOSITORY
          test -s packages/dev/dists/stable/InRelease
          test -s packages/dev/dists/stable/Release.gpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
