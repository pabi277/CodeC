# CodeC website — GitHub Pages deploy.
#
# Created 2026-09-02 by the owner's explicit command "Deploy the website to
# Pages now" (DECISIONS.md D14). The final *verified* deploy of the full
# 25-page site remains W6.7 (web_docs/web-phase6/).
#
# ⚠ ONE Pages site per repo: https://pabi277.github.io/CodeC/ is shared by
# this website AND the signed package repository (/dev + /keys, published by
# package-repository.yml). Every Pages deploy REPLACES the entire site, so
# this workflow never publishes the website alone: it downloads the
# `github-pages` artifact from the newest package-repo publish and unions
# dev/ + keys/ underneath the website files. package-repository.yml does the
# mirror (adds website/ from main). Both jobs share the `pages` concurrency
# group so two deploys can never interleave.
#
# If the newest package-repo artifact has expired (retention), this deploy
# FAILS ON PURPOSE — keep the last good site live and re-run the package
# repository workflow (it now republishes site + repo together).

name: CodeC website (Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-website:
    name: Deploy website (+ current package repo)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find newest live package-repo Pages artifact
        id: repoartifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          read -r artifact_id run_id < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=github-pages&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)][0] | "\(.id) \(.run_id)"' \
            2>/dev/null || echo "- -")
          echo "run_id=${run_id:-}" >> "$GITHUB_OUTPUT"
          echo "newest live github-pages artifact: id=${artifact_id} run_id=${run_id:-none}"

      - name: Download current package repo (dev/ + keys/)
        if: steps.repoartifact.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-current
          run-id: ${{ steps.repoartifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack package repo next to the website
        if: steps.repoartifact.outputs.run_id != ''
        run: |
          set -euo pipefail
          tar -xzf pages-current/artifact.tar -C pages-current
          install -d site
          cp -a pages-current/dev site/dev
          cp -a pages-current/keys site/keys
          test -f site/dev/CODEC-REPOSITORY
          echo "package repo preserved: $(find site/dev -type f | wc -l) files, $(find site/keys -type f | wc -l) key files"

      - name: Add the website
        run: |
          set -euo pipefail
          install -d site
          cp -a website/. site/
          test -f site/index.html
          echo "website files: $(find site -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
