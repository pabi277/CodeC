name: Bootstrap userland

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target arch'
        required: true
        default: 'aarch64'

jobs:
  build:
    name: Build bootstrap ${{ github.event.inputs.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ARCH: ${{ github.event.inputs.arch }}
      PREFIX: /data/data/com.codeci.ide/files/usr
      PKG: com.codeci.ide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-x86-64-linux-gnu \
            binutils-aarch64-linux-gnu \
            binutils-x86-64-linux-gnu \
            wget curl tar gzip python3 \
            autoconf automake libtool pkg-config \
            zip unzip

      - name: Set cross-compiler env
        run: |
          if [[ "$ARCH" == "aarch64" ]]; then
            echo "CROSS=aarch64-linux-gnu-" >> $GITHUB_ENV
            echo "CC_CROSS=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "ANDROID_TRIPLE=aarch64-linux-android" >> $GITHUB_ENV
          else
            echo "CROSS=x86_64-linux-gnu-" >> $GITHUB_ENV
            echo "CC_CROSS=x86_64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "ANDROID_TRIPLE=x86_64-linux-android" >> $GITHUB_ENV
          fi

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK toolchain ready"

      - name: Set NDK toolchain
        run: |
          if [[ "$ARCH" == "aarch64" ]]; then
            TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            echo "CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
            echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          else
            TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
            echo "CC=$TOOLCHAIN/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
            echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          fi

      - name: Build busybox for Android
        run: |
          BUSYBOX_VERSION=1.36.1
          wget -q https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2
          tar -xf busybox-${BUSYBOX_VERSION}.tar.bz2
          cd busybox-${BUSYBOX_VERSION}

          # Use Android-compatible defconfig
          make defconfig

          # Key config overrides for Android/CodeC
          cat >> .config <<EOF
          CONFIG_CROSS_COMPILER_PREFIX=""
          CONFIG_SYSROOT=""
          CONFIG_PREFIX="${PREFIX}"
          CONFIG_SELINUX=n
          CONFIG_FEATURE_HAVE_RPC=n
          CONFIG_FEATURE_INETD_RPC=n
          CONFIG_FEATURE_UTMP=n
          CONFIG_FEATURE_WTMP=n
          CONFIG_BASH_IS_ASH=y
          CONFIG_SH_IS_ASH=y
          CONFIG_ASH_BASH_COMPAT=y
          CONFIG_STATIC=y
          EOF

          # Recalculate config
          make olddefconfig CC="$CC" AR="$AR"

          # Build
          make -j$(nproc) CC="$CC" AR="$AR" STRIP="$STRIP" \
            CONFIG_PREFIX="${PREFIX}" \
            LDFLAGS="--static"

          # Check it's ELF
          file busybox
          head -c 4 busybox | xxd

          cd ..

      - name: Build bash for Android
        run: |
          BASH_VERSION=5.2.21
          wget -q https://ftp.gnu.org/gnu/bash/bash-${BASH_VERSION}.tar.gz
          tar -xf bash-${BASH_VERSION}.tar.gz
          cd bash-${BASH_VERSION}

          ./configure \
            --host=aarch64-linux-android \
            --prefix="${PREFIX}" \
            --without-bash-malloc \
            --disable-nls \
            --disable-rpath \
            CC="$CC" \
            LDFLAGS="-static" \
            CFLAGS="-Os -DANDROID -Dlinux -D__linux__"

          make -j$(nproc)

          file bash
          head -c 4 bash | xxd
          cd ..

      - name: Assemble bootstrap tarball
        run: |
          STAGEDIR=$(mktemp -d)
          mkdir -p \
            "$STAGEDIR/bin" \
            "$STAGEDIR/etc" \
            "$STAGEDIR/tmp" \
            "$STAGEDIR/var/tmp" \
            "$STAGEDIR/usr/bin" \
            "$STAGEDIR/usr/lib" \
            "$STAGEDIR/home"

          # Install busybox
          cd busybox-1.36.1
          make CONFIG_PREFIX="$STAGEDIR" install
          cd ..

          # Install real bash (preferred over busybox ash alias)
          cp bash-5.2.21/bash "$STAGEDIR/bin/bash"
          chmod 755 "$STAGEDIR/bin/bash"

          # Verify no com.termux strings in binaries
          if strings "$STAGEDIR/bin/bash" | grep -q "com.termux"; then
            echo "ERROR: bash binary contains com.termux!" && exit 1
          fi
          if strings "$STAGEDIR/bin/busybox" | grep -q "com.termux"; then
            echo "ERROR: busybox binary contains com.termux!" && exit 1
          fi

          # Verify ELF
          head -c 4 "$STAGEDIR/bin/bash" | xxd
          head -c 4 "$STAGEDIR/bin/busybox" | xxd

          # Basic symlinks
          ln -sf busybox "$STAGEDIR/bin/sh" 2>/dev/null || true
          ln -sf busybox "$STAGEDIR/bin/ls" 2>/dev/null || true

          # Create tarball
          mkdir -p codec-packages/dist
          cd "$STAGEDIR"
          tar -czf "$GITHUB_WORKSPACE/codec-packages/dist/bootstrap-${ARCH}.tar.gz" .
          cd "$GITHUB_WORKSPACE"

          # Generate SHA-256
          sha256sum "codec-packages/dist/bootstrap-${ARCH}.tar.gz" \
            | awk '{print $1}' \
            > "codec-packages/dist/bootstrap-${ARCH}.tar.gz.sha256"

          echo "=== Tarball contents (first 20 entries) ==="
          tar -tzf "codec-packages/dist/bootstrap-${ARCH}.tar.gz" | head -20

          echo "=== SHA-256 ==="
          cat "codec-packages/dist/bootstrap-${ARCH}.tar.gz.sha256"

          echo "=== File sizes ==="
          ls -lh codec-packages/dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ github.event.inputs.arch }}
          path: |
            codec-packages/dist/bootstrap-${{ github.event.inputs.arch }}.tar.gz
            codec-packages/dist/bootstrap-${{ github.event.inputs.arch }}.tar.gz.sha256
          retention-days: 7
