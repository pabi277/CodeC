name: Bootstrap userland

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - x86_64

permissions:
  contents: read

jobs:
  build:
    name: Build official Termux-based bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ARCH: ${{ inputs.arch }}

    steps:
      - name: Checkout CodeC
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost || true
          docker system prune --all --force || true
          df -h

      - name: Install host requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 tar gzip xz-utils
          docker --version
          git --version

      - name: Validate CodeC prefix
        run: |
          set -euo pipefail

          source codec-packages/properties.codec.sh

          test "$TERMUX_APP_PACKAGE" = "com.codeci.ide"
          test "$TERMUX_PREFIX" = \
            "/data/data/com.codeci.ide/files/usr"

          if grep -R -n \
            '/data/data/com\.termux/files/usr' \
            codec-packages \
            --exclude='*.md' \
            --exclude='*.patch'; then
            echo "Unexpected com.termux runtime prefix found" >&2
            exit 1
          fi

      - name: Build packages with official Termux builder
        run: |
          set -euo pipefail
          chmod +x codec-packages/scripts/*.sh

          CODEC_USE_DOCKER=1 \
            codec-packages/scripts/build-bootstrap.sh "$ARCH"

      - name: Validate bootstrap
        run: |
          set -euo pipefail

          ARCHIVE="codec-packages/dist/bootstrap-${ARCH}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          test -s "$ARCHIVE"
          test -s "$CHECKSUM"

          EXPECTED="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

          echo "Archive: $ARCHIVE"
          echo "SHA-256: $ACTUAL"
          ls -lh "$ARCHIVE" "$CHECKSUM"

          tar -tzf "$ARCHIVE" > archive-contents.txt
          head -100 archive-contents.txt

          if tar -xOzf "$ARCHIVE" ./bin/bash 2>/dev/null |
              strings |
              grep -F 'com.termux'; then
            echo "ERROR: Bash contains com.termux" >&2
            exit 1
          fi

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ inputs.arch }}
          path: |
            codec-packages/dist/bootstrap-${{ inputs.arch }}.tar.gz
            codec-packages/dist/bootstrap-${{ inputs.arch }}.tar.gz.sha256
            archive-contents.txt
          if-no-files-found: error
          retention-days: 14
