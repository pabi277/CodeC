name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeC-IDE
          path: app/build/outputs/apk/debug/*.apk

      # Phase 28.1 — the CodeC Keys spike device round needs the bench APK.
      # Built with the REAL wrapper (Gradle 9.3.1): the legacy 9.0.0
      # invocation above cannot configure AGP 9.1.1 modules, and
      # settings.gradle.kts only includes `:bench` for that wrapper.
      # REMOVE THIS BLOCK when Phase 28 closes (same law as the 25.1 wrapper).
      - name: Build + test bench (Phase 28.1 spike, real wrapper)
        run: ./gradlew :bench:assembleRelease :bench:testDebugUnitTest --no-daemon

      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeC-Bench
          path: bench/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'userland-')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
