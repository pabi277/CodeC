name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Phase 25.1 — the bench spike is a SEPARATE APK (com.codeci.bench),
      # built through the real wrapper and uploaded so the owner can install
      # it from this run's artifacts and perform the device round. It is not
      # part of the shipped IDE; remove this step when Phase 25 closes.
      - name: Build bench spike APK (Phase 25.1, not shipped in the app)
        run: ./gradlew :bench:assembleRelease :bench:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeC-IDE
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload bench APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeC-Bench
          path: bench/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'userland-')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
